<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --income: #059669; --expense: #dc2626;
    --bar: #93c5fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f26; --text: #e6e8eb; --muted: #9aa3af;
      --line: #2b323c; --accent: #60a5fa; --income: #34d399; --expense: #f87171;
      --bar: #1e40af;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap {
    max-width: 880px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  /* iPhone で入力時に画面が拡大されないよう 16px 以上にする */
  input, select { font-size: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav span { font-weight: 600; min-width: 110px; text-align: center; }
  button, input, select {
    font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .summary .card { margin: 0; }
  .summary .label { color: var(--muted); font-size: 13px; }
  .summary .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .income { color: var(--income); } .expense { color: var(--expense); }
  form.entry { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 8px; }
  form.entry .memo { grid-column: 1 / 4; }
  .type-toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .type-toggle label { padding: 8px 12px; cursor: pointer; }
  .type-toggle input { display: none; }
  .type-toggle input:checked + span { font-weight: 700; }
  .type-toggle label:has(input[value="expense"]:checked) { background: var(--expense); color: #fff; }
  .type-toggle label:has(input[value="income"]:checked) { background: var(--income); color: #fff; }
  .receipt { margin-bottom: 12px; }
  .receipt button { width: 100%; padding: 12px; font-weight: 600; }
  .receipt-status { margin-top: 8px; font-size: 14px; }
  .receipt-status.error { color: var(--expense); }
  .receipt details { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .receipt pre { white-space: pre-wrap; max-height: 200px; overflow: auto; background: var(--bg); padding: 8px; border-radius: 8px; }
  .filled { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cat-row { display: grid; grid-template-columns: 90px 1fr 100px; gap: 8px; align-items: center; margin: 6px 0; }
  .cat-bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .cat-bar div { height: 100%; background: var(--accent); }
  .cat-row .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .budget-note { font-size: 12px; color: var(--muted); }
  .over .cat-bar div { background: var(--expense); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 13px; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.del button { padding: 2px 8px; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .chart .bars { display: flex; gap: 2px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
  .chart .b { width: 40%; border-radius: 3px 3px 0 0; min-height: 1px; }
  .chart .b.i { background: var(--income); } .chart .b.e { background: var(--expense); }
  .chart .m { font-size: 11px; color: var(--muted); }
  @media (max-width: 600px) {
    .summary { gap: 8px; }
    .summary .card { padding: 10px 8px; text-align: center; }
    .summary .value { font-size: 16px; }
    form.entry { grid-template-columns: 1fr 1fr; }
    form.entry .memo { grid-column: 1 / 3; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>家計簿</h1>
    <div class="month-nav">
      <button id="prev" aria-label="前の月">◀</button>
      <span id="monthLabel"></span>
      <button id="next" aria-label="次の月">▶</button>
    </div>
  </header>

  <div class="summary">
    <div class="card"><div class="label">収入</div><div class="value income" id="sumIncome">¥0</div></div>
    <div class="card"><div class="label">支出</div><div class="value expense" id="sumExpense">¥0</div></div>
    <div class="card"><div class="label">収支</div><div class="value" id="sumBalance">¥0</div></div>
  </div>
  <div style="height:16px"></div>

  <div class="card">
    <h2>記録する</h2>
    <div class="receipt">
      <button type="button" id="receiptBtn">レシートを撮影して読み取る</button>
      <input type="file" id="receiptFile" accept="image/*" capture="environment" hidden>
      <div id="receiptStatus" class="receipt-status" hidden></div>
      <details id="receiptText" hidden><summary>読み取った文字を見る</summary><pre></pre></details>
    </div>
    <form class="entry" id="entryForm">
      <div class="type-toggle">
        <label><input type="radio" name="type" value="expense" checked><span>支出</span></label>
        <label><input type="radio" name="type" value="income"><span>収入</span></label>
      </div>
      <input type="date" name="date" required>
      <select name="category" id="categorySelect"></select>
      <input type="number" name="amount" placeholder="金額" min="1" step="1" required inputmode="numeric">
      <input type="text" name="memo" class="memo" placeholder="メモ（任意）">
      <button class="primary" type="submit">追加</button>
    </form>
  </div>

  <div class="card">
    <h2>カテゴリ別の支出 <span class="budget-note">（予算は「予算設定」から）</span></h2>
    <div id="catList"></div>
  </div>

  <div class="card">
    <h2>過去6か月の推移</h2>
    <div class="chart" id="chart"></div>
  </div>

  <div class="card">
    <h2>今月の明細</h2>
    <table>
      <thead><tr><th>日付</th><th>カテゴリ</th><th class="hide-sm">メモ</th><th style="text-align:right">金額</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <div class="tools">
    <button id="budgetBtn">予算設定</button>
    <button id="exportBtn">CSVで書き出し</button>
    <button id="backupBtn">バックアップ（JSON）</button>
    <button id="restoreBtn">バックアップから復元</button>
    <input type="file" id="restoreFile" accept="application/json" hidden>
  </div>
</div>

<script>
const CATS = {
  expense: ["食費", "日用品", "住居", "水道光熱", "通信", "交通", "医療", "娯楽", "衣服", "交際", "その他"],
  income: ["給与", "賞与", "副収入", "その他"]
};
const KEY = "kakeibo-v1";
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { entries: [], budgets: {} }; }
  catch { return { entries: [], budgets: {} }; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { alert("保存に失敗しました: " + e.message); } }

let db = load();
db.budgets ||= {};
const today = new Date();
let ym = { y: today.getFullYear(), m: today.getMonth() + 1 };
const ymKey = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
const localDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const form = document.getElementById("entryForm");
const catSel = document.getElementById("categorySelect");
form.date.value = localDate(today);

function fillCats() {
  const t = form.type.value;
  catSel.innerHTML = CATS[t].map(c => `<option>${c}</option>`).join("");
}
form.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener("change", fillCats));
fillCats();

form.addEventListener("submit", e => {
  e.preventDefault();
  const amount = Number(form.amount.value);
  if (!amount || amount <= 0) return;
  db.entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    type: form.type.value, date: form.date.value,
    category: catSel.value, amount, memo: form.memo.value.trim()
  });
  save();
  const [y, m] = form.date.value.split("-").map(Number);
  ym = { y, m };
  form.amount.value = ""; form.memo.value = "";
  form.amount.focus();
  render();
});

function shift(d) {
  let m = ym.m + d, y = ym.y;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  ym = { y, m }; render();
}
document.getElementById("prev").onclick = () => shift(-1);
document.getElementById("next").onclick = () => shift(1);

function monthEntries(y, m) {
  const k = ymKey(y, m);
  return db.entries.filter(e => e.date.startsWith(k));
}
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  document.getElementById("monthLabel").textContent = `${ym.y}年${ym.m}月`;
  const list = monthEntries(ym.y, ym.m).sort((a, b) => b.date.localeCompare(a.date));
  const inc = list.filter(e => e.type === "income").reduce((s, e) => s + e.amount, 0);
  const exp = list.filter(e => e.type === "expense").reduce((s, e) => s + e.amount, 0);
  document.getElementById("sumIncome").textContent = yen(inc);
  document.getElementById("sumExpense").textContent = yen(exp);
  const bal = document.getElementById("sumBalance");
  bal.textContent = (inc - exp < 0 ? "-" : "") + yen(Math.abs(inc - exp));
  bal.className = "value " + (inc - exp < 0 ? "expense" : "income");

  // カテゴリ別
  const byCat = {};
  list.filter(e => e.type === "expense").forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
  const cats = CATS.expense.filter(c => byCat[c] || db.budgets[c]);
  const max = Math.max(1, ...cats.map(c => Math.max(byCat[c] || 0, db.budgets[c] || 0)));
  document.getElementById("catList").innerHTML = cats.length ? cats
    .sort((a, b) => (byCat[b] || 0) - (byCat[a] || 0))
    .map(c => {
      const v = byCat[c] || 0, b = db.budgets[c];
      const base = b || max;
      const pct = Math.min(100, v / base * 100);
      const note = b ? `<div class="budget-note">予算 ${yen(b)}・残り ${yen(b - v)}</div>` : "";
      return `<div class="cat-row ${b && v > b ? "over" : ""}"><div>${c}</div>
        <div><div class="cat-bar"><div style="width:${pct}%"></div></div>${note}</div>
        <div class="amt">${yen(v)}</div></div>`;
    }).join("") : `<div class="empty">まだ支出がありません</div>`;

  // 推移
  const months = [];
  for (let i = 5; i >= 0; i--) {
    let m = ym.m - i, y = ym.y; while (m < 1) { m += 12; y--; }
    const es = monthEntries(y, m);
    months.push({ m, i: es.filter(e => e.type === "income").reduce((s, e) => s + e.amount, 0),
                     e: es.filter(e => e.type === "expense").reduce((s, e) => s + e.amount, 0) });
  }
  const cmax = Math.max(1, ...months.flatMap(x => [x.i, x.e]));
  document.getElementById("chart").innerHTML = months.map(x => `
    <div class="col"><div class="bars">
      <div class="b i" style="height:${x.i / cmax * 100}%" title="収入 ${yen(x.i)}"></div>
      <div class="b e" style="height:${x.e / cmax * 100}%" title="支出 ${yen(x.e)}"></div>
    </div><div class="m">${x.m}月</div></div>`).join("");

  // 明細
  document.getElementById("list").innerHTML = list.length ? list.map(e => `
    <tr><td>${e.date.slice(5).replace("-", "/")}</td><td>${e.category}</td>
    <td class="hide-sm">${esc(e.memo || "")}</td>
    <td class="num ${e.type}">${e.type === "expense" ? "-" : "+"}${yen(e.amount)}</td>
    <td class="del"><button data-id="${e.id}" aria-label="削除">×</button></td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">この月の記録はありません</td></tr>`;
}

document.getElementById("list").addEventListener("click", e => {
  const id = e.target.dataset?.id;
  if (!id || !confirm("この記録を削除しますか？")) return;
  db.entries = db.entries.filter(x => x.id !== id);
  save(); render();
});

document.getElementById("budgetBtn").onclick = () => {
  for (const c of CATS.expense) {
    const cur = db.budgets[c] || "";
    const v = prompt(`「${c}」の月の予算（空欄で予算なし）`, cur);
    if (v === null) break;
    const n = Number(v.replace(/[,¥]/g, ""));
    if (n > 0) db.budgets[c] = n; else delete db.budgets[c];
  }
  save(); render();
};

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("exportBtn").onclick = () => {
  const rows = [["日付", "種類", "カテゴリ", "金額", "メモ"]];
  [...db.entries].sort((a, b) => a.date.localeCompare(b.date)).forEach(e =>
    rows.push([e.date, e.type === "income" ? "収入" : "支出", e.category, e.amount, e.memo || ""]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  download("kakeibo.csv", "﻿" + csv, "text/csv");
};
document.getElementById("backupBtn").onclick = () =>
  download(`kakeibo-backup-${localDate(new Date())}.json`, JSON.stringify(db, null, 2), "application/json");
document.getElementById("restoreBtn").onclick = () => document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.entries)) throw new Error("形式が違います");
    if (!confirm(`${data.entries.length}件の記録で上書きします。よろしいですか？`)) return;
    db = { entries: data.entries, budgets: data.budgets || {} };
    save(); render();
  } catch (err) { alert("読み込めませんでした: " + err.message); }
  e.target.value = "";
};

render();

// ===== レシート読み取り =====
// 写真は外部に送らず、端末の中で文字認識（Tesseract.js）する。
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const receiptStatus = document.getElementById("receiptStatus");
const receiptText = document.getElementById("receiptText");
let ocrWorker = null, tesseractLoading = null;

function setStatus(msg, isError = false) {
  receiptStatus.hidden = !msg;
  receiptStatus.textContent = msg;
  receiptStatus.className = "receipt-status" + (isError ? " error" : "");
}

function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return tesseractLoading ||= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = TESSERACT_URL;
    s.onload = resolve;
    s.onerror = () => { tesseractLoading = null; reject(new Error("読み取り機能を読み込めませんでした。ネットにつながっているか確認してください。")); };
    document.head.appendChild(s);
  });
}

async function getWorker() {
  if (ocrWorker) return ocrWorker;
  await loadTesseract();
  ocrWorker = await Tesseract.createWorker("jpn", 1, {
    logger: m => {
      if (m.status === "recognizing text") setStatus(`文字を読み取り中… ${Math.round(m.progress * 100)}%`);
      else if (/load|initializ/.test(m.status)) setStatus("読み取りの準備中…（初回は少し時間がかかります）");
    }
  });
  return ocrWorker;
}

// 読み取りやすいように縮小・白黒・コントラスト強調する
async function prepareImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext("2d");
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i] = d[i + 1] = d[i + 2] = Math.max(0, Math.min(255, (g - 128) * 1.6 + 128));
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

const toHalf = s => s
  .replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/[，､]/g, ",").replace(/[．]/g, ".").replace(/[￥\\]/g, "¥")
  .replace(/[／]/g, "/").replace(/[：]/g, ":").replace(/[－ー−](?=\d)/g, "-");

const CATEGORY_HINTS = [
  [/病院|クリニック|医院|歯科|調剤|処方/, "医療"],
  [/ドラッグ|薬局|マツモトキヨシ|マツキヨ|ウエルシア|ツルハ|スギ薬局|サンドラッグ|ココカラ|ダイソー|セリア|ホームセンター|カインズ|ニトリ/, "日用品"],
  [/ユニクロ|UNIQLO|GU|しまむら|ZARA|H&M/i, "衣服"],
  [/JR|駅|タクシー|ガソリン|ENEOS|出光|コスモ石油|パーキング|駐車/, "交通"],
  [/居酒屋|酒場|ダイニング|バー/, "交際"],
  [/映画|シネマ|カラオケ|書店|ブックオフ|ゲーム/, "娯楽"],
  [/スーパー|マート|イオン|西友|ライフ|イトーヨーカドー|業務スーパー|まいばすけっと|ローソン|セブン|ファミリーマート|ミニストップ|成城石井|食品|青果|精肉|ベーカリー|パン|カフェ|コーヒー|スターバックス|ドトール|マクドナルド|すき家|松屋|吉野家|レストラン|食堂/, "食費"],
];

function parseReceipt(raw) {
  const lines = raw.split("\n").map(l => toHalf(l).replace(/\s+/g, "")).filter(Boolean);
  const nums = l => (l.match(/\d{1,3}(?:,\d{3})+|\d+/g) || []).map(n => Number(n.replace(/,/g, ""))).filter(n => n > 0 && n < 10000000);
  const yenIn = l => { const m = l.match(/¥(\d{1,3}(?:,\d{3})+|\d+)/); return m ? Number(m[1].replace(/,/g, "")) : null; };
  const amountOf = l => yenIn(l) ?? (/点/.test(l) ? null : (nums(l).length ? Math.max(...nums(l)) : null));

  // 金額：「合計」などの行（小計・お預り・お釣りは除く）。行に数字がなければ次の行を見る
  let amount = null;
  for (let i = 0; i < lines.length && !amount; i++) {
    const l = lines[i];
    if (/合計|総計|買上|ご請求|お支払|支払金額|税込計/.test(l) && !/小計|預|釣/.test(l)) {
      amount = amountOf(l) || (lines[i + 1] && !/預|釣/.test(lines[i + 1]) ? amountOf(lines[i + 1]) : null);
    }
  }
  if (!amount) {
    const vals = lines.filter(l => !/預|釣|小計/.test(l)).map(yenIn).filter(Boolean);
    if (vals.length) amount = Math.max(...vals);
  }

  // 日付：2026年11月9日 / 2026/11/09 / 令和8年11月9日 など
  let date = null;
  const text = lines.join("\n");
  const valid = (y, m, d) => m >= 1 && m <= 12 && d >= 1 && d <= 31 ? `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}` : null;
  let m = text.match(/(20\d{2})[年\/.\-](\d{1,2})[月\/.\-](\d{1,2})/);
  if (m) date = valid(m[1], +m[2], +m[3]);
  if (!date && (m = text.match(/(?:令和|R)(\d{1,2})[年\/.\-](\d{1,2})[月\/.\-](\d{1,2})/))) date = valid(2018 + +m[1], +m[2], +m[3]);

  // お店の名前：上の方にある、文字が2つ以上並んだ行
  const store = lines.slice(0, 6).find(l =>
    /[ぁ-んァ-ヶ一-龠A-Za-z]{2,}/.test(l) && !/領収|レシート|TEL|電話|〒|登録番号|ようこそ|ありがとう|^\d/.test(l)) || "";

  const category = (CATEGORY_HINTS.find(([re]) => re.test(text)) || [, "食費"])[1];
  return { amount, date, store: store.slice(0, 30), category };
}

function applyReceipt(r) {
  form.querySelector('input[value="expense"]').checked = true;
  fillCats();
  catSel.value = r.category;
  if (r.date) form.date.value = r.date;
  if (r.amount) form.amount.value = r.amount;
  if (r.store) form.memo.value = r.store;
  [catSel, form.date, form.amount, form.memo].forEach(el => el.classList.add("filled"));
  setTimeout(() => [catSel, form.date, form.amount, form.memo].forEach(el => el.classList.remove("filled")), 4000);
  const missing = [!r.amount && "金額", !r.date && "日付"].filter(Boolean);
  setStatus(missing.length
    ? `${missing.join("と")}を読み取れませんでした。入力してから「追加」を押してください。`
    : "読み取りました。内容を確認して「追加」を押してください。", missing.length > 0);
  form.amount.focus();
}

async function readReceipt(file) {
  const btn = document.getElementById("receiptBtn");
  btn.disabled = true;
  receiptText.hidden = true;
  try {
    setStatus("画像を準備中…");
    const canvas = await prepareImage(file);
    const worker = await getWorker();
    const { data } = await worker.recognize(canvas);
    receiptText.querySelector("pre").textContent = data.text;
    receiptText.hidden = false;
    const result = parseReceipt(data.text);
    applyReceipt(result);
    return result;
  } catch (err) {
    setStatus(err.message || "読み取りに失敗しました。", true);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("receiptBtn").onclick = () => document.getElementById("receiptFile").click();
document.getElementById("receiptFile").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) readReceipt(f);
};

// オフライン対応と、ブラウザに記録を消されにくくするお願い
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
navigator.storage?.persist?.().catch(() => {});
</script>
